name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t qubit-wink .
      - name: Smoke test the container
        run: |
          docker run -d --rm -p 8000:8000 --name qw qubit-wink
          for i in $(seq 1 30); do curl -sf localhost:8000/api/health && break; sleep 1; done
          curl -sf -X POST localhost:8000/api/run -H 'content-type: application/json' \
            -d '{"a":";)","b":"8)","shots":100}' | grep -q '8)'
          docker stop qw
